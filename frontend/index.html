<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joint Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@800&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        var fallback = location.pathname === '/' ? 'dark' : null
        var t = null
        try { t = localStorage.getItem('jd-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = fallback || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
